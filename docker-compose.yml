services:
  postgres:
    image: postgres:18-alpine
    container_name: rupert_postgres_container
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-rupert_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    networks:
      - rupert
    volumes:
      - rupert_postgres_storage:/var/lib/postgresql/18/data
    healthcheck:
      test: "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      start_period: 15s
      interval: 30s
      timeout: 15s
      retries: 3

  redis:
    image: redis/redis-stack-server:latest
    container_name: rupert_redis_container
    restart: unless-stopped
    environment:
      - REDIS_USER=${REDIS_USER:-default}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:-password} --maxmemory 2048mb --maxmemory-policy allkeys-lru --appendonly yes --protected-mode no --save 3600 1 300 100 60 1000 --rdbcompression yes --dbfilename dump.rdb
    ports:
      - "6379:6379"
    networks:
      - rupert
    volumes:
      - rupert_redis_storage:/data
    healthcheck:
      test: "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"
      start_period: 15s
      interval: 30s
      timeout: 15s
      retries: 3

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rupert_rustfs_container
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      - RUSTFS_VOLUMES=${RUSTFS_VOLUMES:-/data/rustfs}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-default}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-password}
      - RUSTFS_SERVER_DOMAINS=${RUSTFS_SERVER_DOMAINS:-192.168.10.11}
      - RUSTFS_CONSOLE_ENABLE=${RUSTFS_CONSOLE_ENABLE:-true}
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=${RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS:-*}
      - RUSTFS_ADDRESS=${RUSTFS_ADDRESS:-:9000}
      - RUSTFS_CONSOLE_ADDRESS=${RUSTFS_CONSOLE_ADDRESS:-:9001}
      - RUSTFS_OBS_LOGGER_LEVEL=${RUSTFS_OBS_LOGGER_LEVEL:-warning}
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-false}
    ports:
      - "9000:9000"
      - "9001:9001"
      # - "192.168.10.11:9000:9000"
      # - "192.168.10.11:9001:9001"
    networks:
      - rupert
    volumes:
      - rupert_rustfs_storage:/data/rustfs
    depends_on:
      rustfs-volume-permission-helper:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health",
        ]
      start_period: 15s
      interval: 30s
      timeout: 15s
      retries: 3

  rustfs-volume-permission-helper:
    image: alpine:latest
    container_name: rupert_rustfs_permission_helper
    volumes:
      - rupert_rustfs_storage:/data/rustfs
    # - default RustFS runtime user is 10001:10001
    command: "chown -R 10001:10001 /data/rustfs && echo 'RustFS volume permissions fixed'"
    restart: "no"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: rupert_redisinsight_container
    restart: unless-stopped
    environment:
      - RI_APP_PORT=${RI_APP_PORT:-5540}
      - RI_APP_HOST=${RI_APP_HOST:-0.0.0.0}
      - RI_LOG_LEVEL=${RI_LOG_LEVEL:-warning}
      - RI_REDIS_HOST=${RI_REDIS_HOST:-redis}
      - RI_REDIS_PORT=${REDIS_PORT:-6379}
      - RI_REDIS_USERNAME=${REDIS_USERNAME:-default}
      - RI_REDIS_PASSWORD=${REDIS_PASSWORD:-password}
    ports:
      - "5540:5540"
    networks:
      - rupert
    volumes:
      - rupert_redisinsight_storage:/data

  pgadmin4:
    image: dpage/pgadmin4
    container_name: rupert_pgadmin4_container
    restart: unless-stopped
    user: "5050:5050"
    environment:
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-pgadmin4}
      - PGADMIN_LISTEN_PORT=${PGADMIN_LISTEN_PORT:-5550}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin4.com}
        # Don't require the user to login
      - PGADMIN_CONFIG_SERVER_MODE=False
        # Don't require a "master" password after logging in
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5550:5550"
    networks:
      - rupert
    volumes:
      - rupert_pgadmin4_storage:/var/lib/pgadmin

volumes:
  rupert_postgres_storage:
    name: rupert_postgres_storage_volume
  rupert_redis_storage:
    name: rupert_redis_storage_volume
  rupert_rustfs_storage:
    name: rupert_rustfs_storage_volume
  rupert_redisinsight_storage:
    name: rupert_redisinsight_storage_volume
  rupert_pgadmin4_storage:
    name: rupert_pgadmin4_storage_volume

networks:
  rupert:
